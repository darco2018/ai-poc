spring.application.name=ai-poc

# Server
server.port=8080

# Database selection
# Default profile is "h2". Switch to MySQL with any of:
#   SPRING_PROFILES_ACTIVE=mysql            (env var)
#   --spring.profiles.active=mysql          (program argument)
#   ./gradlew bootRun -Pdb=mysql            (Gradle)
# Datasource settings live in application-mysql.properties / application-h2.properties
spring.profiles.default=h2

# H2 Console (disabled by default, enabled in application-h2.properties)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized







##### USED WITH  FILE LOADER TO CALL ANTHROPIC #############

# Document Q&A (Anthropic API key is read from the ANTHROPIC_API_KEY env var)
# Non-ASCII characters are written as unicode escapes (\u2014 = em dash) so the file loads the same under any charset.
fileDocument-qa.system-prompt=You answer questions about the attached essay. For each question:\n\
Find the passages that actually address it \u2014 the essay is the only source material.\n\
Answer in two parts: a direct answer first, then the supporting evidence as short quotes with citations. Never paraphrase a claim you could quote.\n\
Stay inside the text. If the essay doesn't address the question, say so \u2014 don't fill gaps with outside knowledge or speculation about the author's views.\n\
Keep answers tight: 
# \most questions need one or two quotes, not a survey of the whole essay.\n

fileDocument-qa.user-prompt=What does the essay predict about biology and health in the years after powerful AI arrives, and what does it claim is the real bottleneck to progress?
fileDocument-qa.default-model=claude-haiku-4-5

# limits output only, meaning the tokens Claude generates in its answer
# value passed to the API's max_tokens parameter via .maxTokens(request.maxTokens()) in buildParams
# The only limit on input is the model's context window (eg 200K tokens for Haiku 4.5).
# Input plus max_tokens must fit within the context window
fileDocument-qa.default-max-tokens=200

# Directory the ?file= documents are read from (relative to the working directory)
fileDocument-qa.documents-dir=documents
# Document used when ?file= is omitted.
# The other files are Machines-of-Loving-Grace.txt and Machines-of-Loving-Grace-7000-tokens.txt
fileDocument-qa.default-file=Machines-of-Loving-Grace-introduction-1300-tokens.txt

# Deterministic mock service toggle (when true, hard-coded mock responses and telemetry are returned without invoking Anthropic API)
fileDocument-qa.mock-enabled=true
############################################################################