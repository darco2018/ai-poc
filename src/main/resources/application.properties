spring.application.name=ai-poc

# Server
server.port=8080

# Database selection
# Default profile is "mysql". Switch to H2 with any of:
#   SPRING_PROFILES_ACTIVE=h2            (env var)
#   --spring.profiles.active=h2          (program argument)
#   ./gradlew bootRun -Pdb=h2            (Gradle)
# Datasource settings live in application-mysql.properties / application-h2.properties
spring.profiles.default=mysql

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
