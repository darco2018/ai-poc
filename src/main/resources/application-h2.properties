# H2 in-memory datasource in MySQL compatibility mode (override via DB_URL / DB_USERNAME / DB_PASSWORD env vars)
# For a file-based DB that survives restarts use: DB_URL=jdbc:h2:file:./data/ai_poc;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.url=${DB_URL:jdbc:h2:mem:ai_poc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console at http://localhost:8080/h2-console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
