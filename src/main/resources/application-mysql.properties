# MySQL datasource (override via DB_URL / DB_USERNAME / DB_PASSWORD env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_poc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 web console disabled for MySQL profile
spring.h2.console.enabled=false
